name: Build Clash Commander APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > local.properties

      - name: Download speech dependencies
        run: |
          chmod +x scripts/bootstrap_sherpa_deps.sh
          ./scripts/bootstrap_sherpa_deps.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
